server { listen 80; server_name zygo-taxi.com www.zygo-taxi.com; return 301 https://$host$request_uri; }
server {
    listen 443 ssl;
    server_name zygo-taxi.com www.zygo-taxi.com;
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/dashboard;
    index index.php index.html;

    # Timeouts for large uploads
    fastcgi_read_timeout 300;
    fastcgi_send_timeout 300;
    proxy_read_timeout 300;

    location ~ ^/api/.*\.php$ {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/dashboard/$fastcgi_script_name;
        fastcgi_param HTTPS on;
    }
    location ~ ^/api(/.*)?$ {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 300;
    }
    location /uploads {
        root /var/www/backend/public;
    }
    location /storage/app/public {
        alias /var/www/backend/storage/app/public;
        try_files $uri $uri/ =404;
    }
    location /storage {
        alias /var/www/backend/public/storage;
        try_files $uri $uri/ =404;
    }
    location /app {
        proxy_pass http://reverb:6001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    location ~ \.php$ {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
    }
    client_max_body_size 50M;
}
